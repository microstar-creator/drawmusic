<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draw Music – Legal</title>
<style>
  :root { --bg: #FAF5EB; --card: #FFFDFA; --text: #3D3C38; --sub: #6E6B66; --accent: #9282FA; --line: #EAE3D6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E1D1B; --card: #262522; --text: #EDEAE4; --sub: #B3AFA8; --accent: #B3A8FF; --line: #3A3834; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "Segoe UI", Roboto, "Inter", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .meta { color: var(--sub); font-size: 14px; margin: 0 0 20px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); }
  li a { display: block; padding: 14px 0; font-weight: 600; text-decoration: none; color: var(--accent); }
  a { color: var(--accent); }
  p { margin: 20px 0 0; }
</style>
</head>
<body>
<main>
<div class="card">
<h1>Draw Music</h1>
<p class="meta">Draw Music for Android · by MICROSTAR TECH LAB</p>
<ul>
  <li><a href="privacy-policy.html">Privacy Policy</a></li>
  <li><a href="terms-of-service.html">Terms of Service</a></li>
</ul>
<p>Contact: <a href="mailto:microstartechlab@gmail.com">microstartechlab@gmail.com</a></p>
</div>
</main>
</body>
</html>
